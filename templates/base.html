<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Neal's Chess Coach{% endblock %}</title>
<!-- Chess board: chessboard.js + chess.js -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"/>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<!-- Charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Alpine.js for lightweight interactivity -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d26; --border: #2e3244;
    --text: #e8e6de; --muted: #6b6878; --faint: #2a2d3e;
    --green: #5cb88a; --red: #e05c5c; --amber: #d4a843; --purple: #9b7fe8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:4px;height:52px}
  .nav-brand{font-size:15px;font-weight:600;color:#fff;margin-right:16px;text-decoration:none}
  .nav-brand span{color:var(--green)}
  .nav-link{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:13px;transition:all .15s}
  .nav-link:hover,.nav-link.active{background:var(--faint);color:var(--text)}
  .main{max-width:1100px;margin:0 auto;padding:28px 24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;border:none;transition:all .15s}
  .btn-primary{background:var(--purple);color:#fff}
  .btn-primary:hover{background:#8b6fd8}
  .btn-secondary{background:var(--faint);color:var(--text);border:1px solid var(--border)}
  .btn-secondary:hover{border-color:var(--purple)}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .badge-win{background:#0f2a1a;color:var(--green);border:1px solid #1e5530}
  .badge-loss{background:#2a1515;color:var(--red);border:1px solid #5a2020}
  .badge-draw{background:#2a2510;color:var(--amber);border:1px solid #5a5020}
  .badge-critical{background:#2a1515;color:var(--red);border:1px solid #5a2020}
  .badge-moderate{background:#2a2510;color:var(--amber);border:1px solid #5a5020}
  .badge-minor{background:var(--faint);color:var(--muted);border:1px solid var(--border)}
  /* Chess board highlight colors */
  .highlight-bad{box-shadow:inset 0 0 0 3px var(--red)!important}
  .highlight-good{box-shadow:inset 0 0 0 3px var(--green)!important}
  .highlight-tip{box-shadow:inset 0 0 0 3px var(--amber)!important}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <a href="/" class="nav-brand">♟ Neal's <span>Coach</span></a>
  <a href="/dashboard/" class="nav-link {% if request.url.path.startswith('/dashboard') %}active{% endif %}">Dashboard</a>
  <a href="/games/" class="nav-link {% if request.url.path.startswith('/games') %}active{% endif %}">Games</a>
  <a href="/profile/" class="nav-link {% if request.url.path.startswith('/profile') %}active{% endif %}">Profile</a>
  <a href="/games/upload" class="btn btn-primary" style="margin-left:auto">+ Upload Game</a>
</nav>
<div class="main">
  {% block content %}{% endblock %}
</div>
</body>
</html>
